plugins {
    id "java"
}

group = "link.e4steam"
version = "0.3.0-beta.1"

repositories {
    mavenCentral()
    maven { url "https://libraries.minecraft.net/" }
    maven { url "https://maven.fabricmc.net/" }
}

def minecraftClient = layout.buildDirectory.file("minecraft/minecraft-26.2-client.jar")

tasks.register("prepareMinecraftClient") {
    outputs.file(minecraftClient)
    doLast {
        File target = minecraftClient.get().asFile
        if (target.isFile()) return
        target.parentFile.mkdirs()

        String configured = providers.gradleProperty("minecraft26_client").orNull
        if (configured == null) configured = providers.environmentVariable("MINECRAFT_26_CLIENT").orNull
        if (configured != null && file(configured).isFile()) {
            java.nio.file.Files.copy(file(configured).toPath(), target.toPath())
            return
        }

        def manifest = new groovy.json.JsonSlurper().parse(
                new URI("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json").toURL()
        )
        def version = manifest.versions.find { it.id == "26.2" }
        if (version == null) throw new GradleException("Minecraft 26.2 is missing from Mojang's version manifest")
        def details = new groovy.json.JsonSlurper().parse(new URI(version.url).toURL())
        new URI(details.downloads.client.url).toURL().withInputStream { input ->
            target.withOutputStream { output -> output << input }
        }
    }
}

dependencies {
    compileOnly files(minecraftClient)
    compileOnly files("../common/build/classes/java/main")
    compileOnly "com.mojang:authlib:9.0.75"
    compileOnly "com.mojang:brigadier:1.3.10"
    compileOnly "org.slf4j:slf4j-api:2.0.17"
    compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named("prepareMinecraftClient")
    options.encoding = "UTF-8"
    options.release = 25
}

jar {
    archiveFileName = "e4steam-modern26-ui.jar"
}
